<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact · My Little Blog</title>
  <style>
    :root {
      --pink: #f8a5c2;
      --light-pink: #fff0f5;
      --soft-pink: #ffe4ec;
      --text: #4a4a4a;
      --muted: #888;
      --white: #ffffff;
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--light-pink);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: var(--white);
      padding: 1.5rem 2rem;
      border-bottom: 2px solid var(--soft-pink);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--pink);
      text-decoration: none;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      margin-left: 1.5rem;
      font-size: 0.95rem;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      transition: all 0.2s;
    }

    nav a:hover,
    nav a.active {
      background: var(--soft-pink);
      color: var(--pink);
    }

    main {
      max-width: 720px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }

    .card {
      background: var(--white);
      padding: 2.2rem;
      border-radius: var(--radius);
      border: 1px solid var(--soft-pink);
    }

    .card h1 {
      font-size: 1.8rem;
      color: var(--pink);
      margin-bottom: 0.5rem;
    }

    .card > p {
      color: var(--muted);
      margin-bottom: 1.8rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }

    input, textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      margin-bottom: 1.2rem;
      border: 1px solid var(--soft-pink);
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      background: var(--light-pink);
      color: var(--text);
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--pink);
    }

    button {
      background: var(--pink);
      color: white;
      border: none;
      padding: 0.75rem 1.8rem;
      border-radius: 999px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #f78fb3;
    }

    footer {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer a { color: var(--pink); text-decoration: none; }

    @media (max-width: 600px) {
      header { flex-direction: column; text-align: center; }
      nav a { margin: 0 0.4rem; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">🧸 The Daily Mimi</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h1>Say hi!</h1>
      <p>Feel free to send a little message!
      </p>

      <form>
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name">

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com">

        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="Write something soft..."></textarea>
        

          <button type="button">Send message</button>
      </form>
    </div>
  </main> 
 

  <footer>
    <p>Made with care · <a href="index.html">Back to home</a></p>
  </footer>

</body>
</html>
